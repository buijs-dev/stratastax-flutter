name: stx_i18n
description: Compiled i18n runtime (message keys, locale scope, plural rules) with translations from a backend laid over it. Depends on flutter/widgets and stx_icu only.
version: 0.0.1
publish_to: none

environment:
  sdk: ^3.11.0
  flutter: ">=3.41.0"

resolution: workspace

dependencies:
  flutter:
    sdk: flutter
  meta: ^1.18.0
  stx_icu: ^0.0.1
dev_dependencies:
  flutter_test:
    sdk: flutter
  yaml: ^3.1.4
