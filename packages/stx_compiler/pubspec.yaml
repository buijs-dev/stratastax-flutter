name: stx_compiler
description: The stx CLI - reads OpenAPI, tokens, i18n and annotated Dart sources and generates Flutter code.
version: 0.0.1
publish_to: none

environment:
  sdk: ^3.11.0

resolution: workspace
dependencies:
  analyzer: ^12.1.0
  args: ^2.7.0
  dart_style: ^3.1.8
  path: ^1.9.1
  watcher: ^1.2.1
  yaml: ^3.1.4
  yaml_edit: ^2.2.4

executables:
  stx: stx
dev_dependencies:
  test: ^1.31.0
