# Design tokens of match_tracker: only what is specific to the app. Everything else comes from the
# Stratastax brand layer (tokens.base in stx.yaml: stratastax-design) on top of the stx_style
# defaults (packages/stx_style/lib/defaults/defaults.tokens.yaml).
primitives:
  palette:
    orange: { 400: '#FB923C', 700: '#C2410C' }

color:
  extend:
    # A winner is a success; a loss is quiet orange, never the danger red.
    win:   '{color.success}'
    onWin: '{color.onSuccess}'
    loss:  { light: '{palette.orange.700}', dark: '{palette.orange.400}' }

components:
  button:
    extend:
      win: { background: win, foreground: onWin }
