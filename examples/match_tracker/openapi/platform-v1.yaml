openapi: 3.1.0
info:
  version: 1.0.0
  title: Stratastax API
  contact:
    name: Contact our support
    email: info@buijs.dev
    url: https://buijs.dev/
  license:
    name: Apache-2.0
    url: https://github.com/buijs-dev/stratastax-contract/blob/develop/LICENSE
  description: Match tracking API for the Stratastax engine platform.
servers:
  - url: https://stratastax.dev/rest
security:
  - bearerAuth: []
tags:
  - name: matches
    description: Match tracking operations.
  - name: matchEdits
    description: Match edit proposal and approval workflow.
  - name: games
    description: Game catalogue.
  - name: expansions
    description: Game expansion management.
  - name: playsets
    description: Playset configuration management.
  - name: ghostPlayers
    description: Ghost player management.
  - name: canonicalPlayers
    description: Canonical player profile.
  - name: trustedEditors
    description: Trusted editor grant management.
  - name: claimRequests
    description: Ghost player claim request workflow.
  - name: claimEdges
    description: Active ghost player claim edges.
  - name: privacySettings
    description: Privacy configuration per data type.
  - name: groups
    description: Group management for privileged access control.
  - name: communities
    description: Community management.
  - name: memberships
    description: Community membership management.
  - name: membershipRequests
    description: Community membership request workflow.
  - name: users
    description: The current user and finding other users.
paths:
  /api/v1/matches/count:
    get:
      summary: Count matches
      operationId: countMatches
      security:
        - bearerAuth:
            - stx-engine:match-read
      tags:
        - matches
      parameters:
        - $ref: '#/components/parameters/query_filter'
      responses:
        '200':
          $ref: '#/components/responses/count'
        '400':
          $ref: '#/components/responses/validation_error'
        '401':
          $ref: '#/components/responses/unauthorized_error'
        '403':
          $ref: '#/components/responses/forbidden_error'
        '500':
          $ref: '#/components/responses/internal_server_error'
  /api/v1/matches/{matchId}:
    parameters:
      - $ref: '#/components/parameters/path_match_id'
    get:
      summary: Get match
      operationId: getMatch
      security:
        - bearerAuth:
            - stx-engine:match-read
      tags:
        - matches
      responses:
        '200':
          $ref: '#/components/responses/match'
        '401':
          $ref: '#/components/responses/unauthorized_error'
        '403':
          $ref: '#/components/responses/forbidden_error'
        '404':
          $ref: '#/components/responses/not_found_error'
    patch:
      summary: Update match
      description: |
        Updates match fields. While the match is DRAFT, all fields including participants may be changed here. Once FINALIZED, only playedAt and editRequestsEnabled remain directly editable; use POST /matches/{matchId}/edits for anything else.
      operationId: updateMatch
      security:
        - bearerAuth:
            - stx-engine:match-update
      tags:
        - matches
      parameters:
        - $ref: '#/components/parameters/header_if_match'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/update_match'
      responses:
        '200':
          $ref: '#/components/responses/match'
        '400':
          $ref: '#/components/responses/validation_error'
        '401':
          $ref: '#/components/responses/unauthorized_error'
        '403':
          $ref: '#/components/responses/forbidden_error'
        '404':
          $ref: '#/components/responses/not_found_error'
        '409':
          $ref: '#/components/responses/conflict_error'
        '412':
          $ref: '#/components/responses/precondition_failed_error'
    delete:
      summary: Delete match
      description: Only allowed while the match is DRAFT.
      operationId: deleteMatch
      security:
        - bearerAuth:
            - stx-engine:match-delete
      tags:
        - matches
      parameters:
        - $ref: '#/components/parameters/header_if_match'
      responses:
        '204':
          description: Deleted successfully
        '401':
          $ref: '#/components/responses/unauthorized_error'
        '403':
          $ref: '#/components/responses/forbidden_error'
        '404':
          $ref: '#/components/responses/not_found_error'
        '409':
          $ref: '#/components/responses/conflict_error'
        '412':
          $ref: '#/components/responses/precondition_failed_error'
  /api/v1/matches/{matchId}/finalize:
    parameters:
      - $ref: '#/components/parameters/path_match_id'
    patch:
      summary: Finalize a match
      description: |
        Transitions a match from DRAFT to FINALIZED. From this point on, changes to participants, scores, playset or expansions must go through POST /matches/{matchId}/edits. This transition is one-way.
      operationId: finalizeMatch
      security:
        - bearerAuth:
            - stx-engine:match-finalize
      tags:
        - matches
      parameters:
        - $ref: '#/components/parameters/header_if_match'
      responses:
        '200':
          $ref: '#/components/responses/match'
        '401':
          $ref: '#/components/responses/unauthorized_error'
        '403':
          $ref: '#/components/responses/forbidden_error'
        '404':
          $ref: '#/components/responses/not_found_error'
        '409':
          $ref: '#/components/responses/conflict_error'
        '412':
          $ref: '#/components/responses/precondition_failed_error'
  /api/v1/matches/{matchId}/edits:
    parameters:
      - $ref: '#/components/parameters/path_match_id'
    get:
      summary: List edits for a match
      operationId: listMatchEdits
      security:
        - bearerAuth:
            - stx-engine:match-edit-read
      tags:
        - matchEdits
      parameters:
        - $ref: '#/components/parameters/query_limit'
        - $ref: '#/components/parameters/query_cursor'
        - $ref: '#/components/parameters/query_filter'
        - $ref: '#/components/parameters/query_sort'
      responses:
        '200':
          $ref: '#/components/responses/match_edit_list'
        '401':
          $ref: '#/components/responses/unauthorized_error'
        '403':
          $ref: '#/components/responses/forbidden_error'
        '404':
          $ref: '#/components/responses/not_found_error'
        '500':
          $ref: '#/components/responses/internal_server_error'
    post:
      summary: Propose a match edit
      operationId: createMatchEdit
      security:
        - bearerAuth:
            - stx-engine:match-edit-create
      tags:
        - matchEdits
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/create_match_edit'
      responses:
        '201':
          $ref: '#/components/responses/match_edit'
        '400':
          $ref: '#/components/responses/validation_error'
        '401':
          $ref: '#/components/responses/unauthorized_error'
        '403':
          $ref: '#/components/responses/forbidden_error'
        '404':
          $ref: '#/components/responses/not_found_error'
        '409':
          $ref: '#/components/responses/conflict_error'
        '500':
          $ref: '#/components/responses/internal_server_error'
  /api/v1/matches/{matchId}/edits/{editId}:
    parameters:
      - $ref: '#/components/parameters/path_match_id'
      - $ref: '#/components/parameters/path_edit_id'
    get:
      summary: Get match edit
      operationId: getMatchEdit
      security:
        - bearerAuth:
            - stx-engine:match-edit-read
      tags:
        - matchEdits
      responses:
        '200':
          $ref: '#/components/responses/match_edit'
        '401':
          $ref: '#/components/responses/unauthorized_error'
        '403':
          $ref: '#/components/responses/forbidden_error'
        '404':
          $ref: '#/components/responses/not_found_error'
    patch:
      summary: Decide on a match edit (approve or reject)
      operationId: decideMatchEdit
      security:
        - bearerAuth:
            - stx-engine:match-edit-decide
      tags:
        - matchEdits
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/decide_match_edit'
      responses:
        '200':
          $ref: '#/components/responses/match_edit'
        '400':
          $ref: '#/components/responses/validation_error'
        '401':
          $ref: '#/components/responses/unauthorized_error'
        '403':
          $ref: '#/components/responses/forbidden_error'
        '404':
          $ref: '#/components/responses/not_found_error'
        '409':
          $ref: '#/components/responses/conflict_error'
  /api/v1/matches:
    get:
      summary: List matches
      operationId: listMatches
      security:
        - bearerAuth:
            - stx-engine:match-read
      tags:
        - matches
      parameters:
        - $ref: '#/components/parameters/query_limit'
        - $ref: '#/components/parameters/query_cursor'
        - $ref: '#/components/parameters/query_filter'
        - $ref: '#/components/parameters/query_sort'
      responses:
        '200':
          $ref: '#/components/responses/match_list'
        '400':
          $ref: '#/components/responses/validation_error'
        '401':
          $ref: '#/components/responses/unauthorized_error'
        '403':
          $ref: '#/components/responses/forbidden_error'
        '500':
          $ref: '#/components/responses/internal_server_error'
    post:
      summary: Create match
      operationId: createMatch
      security:
        - bearerAuth:
            - stx-engine:match-create
      tags:
        - matches
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/create_match'
      responses:
        '201':
          $ref: '#/components/responses/match'
        '400':
          $ref: '#/components/responses/validation_error'
        '401':
          $ref: '#/components/responses/unauthorized_error'
        '403':
          $ref: '#/components/responses/forbidden_error'
        '409':
          $ref: '#/components/responses/conflict_error'
        '500':
          $ref: '#/components/responses/internal_server_error'
  /api/v1/matches/batch:
    post:
      summary: Create multiple matches in one request
      operationId: createMatchBatch
      security:
        - bearerAuth:
            - stx-engine:match-create
      tags:
        - matches
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/create_match_batch'
      responses:
        '207':
          $ref: '#/components/responses/match_batch_result'
        '400':
          $ref: '#/components/responses/validation_error'
        '401':
          $ref: '#/components/responses/unauthorized_error'
        '403':
          $ref: '#/components/responses/forbidden_error'
        '500':
          $ref: '#/components/responses/internal_server_error'
  /api/v1/games/suggestions:
    get:
      summary: Get game suggestions
      operationId: getGameSuggestions
      security:
        - bearerAuth:
            - stx-engine:game-read
      tags:
        - games
      parameters:
        - $ref: '#/components/parameters/query_query'
      responses:
        '200':
          $ref: '#/components/responses/game_ref_list'
        '400':
          $ref: '#/components/responses/validation_error'
        '401':
          $ref: '#/components/responses/unauthorized_error'
        '403':
          $ref: '#/components/responses/forbidden_error'
        '500':
          $ref: '#/components/responses/internal_server_error'
  /api/v1/games/{gameId}:
    parameters:
      - $ref: '#/components/parameters/path_game_id'
    get:
      summary: Get game
      operationId: getGame
      security:
        - bearerAuth:
            - stx-engine:game-read
      tags:
        - games
      responses:
        '200':
          $ref: '#/components/responses/game'
        '401':
          $ref: '#/components/responses/unauthorized_error'
        '403':
          $ref: '#/components/responses/forbidden_error'
        '404':
          $ref: '#/components/responses/not_found_error'
  /api/v1/games/{gameId}/expansions:
    parameters:
      - $ref: '#/components/parameters/path_game_id'
    get:
      summary: List expansions for a game
      operationId: listExpansions
      security:
        - bearerAuth:
            - stx-engine:expansion-read
      tags:
        - expansions
      parameters:
        - $ref: '#/components/parameters/query_limit'
        - $ref: '#/components/parameters/query_cursor'
        - $ref: '#/components/parameters/query_filter'
        - $ref: '#/components/parameters/query_sort'
      responses:
        '200':
          $ref: '#/components/responses/expansion_list'
        '401':
          $ref: '#/components/responses/unauthorized_error'
        '403':
          $ref: '#/components/responses/forbidden_error'
        '404':
          $ref: '#/components/responses/not_found_error'
        '500':
          $ref: '#/components/responses/internal_server_error'
    post:
      summary: Create expansion
      description: |
        Adds an expansion to a game. Requires the `stx-engine:expansion-create` role; the game catalog service publishes approved candidates through this operation.
      operationId: createExpansion
      security:
        - bearerAuth:
            - stx-engine:expansion-create
      tags:
        - expansions
      parameters:
        - $ref: '#/components/parameters/header_idempotency_key'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/create_expansion'
      responses:
        '201':
          $ref: '#/components/responses/created_expansion'
        '400':
          $ref: '#/components/responses/validation_error'
        '401':
          $ref: '#/components/responses/unauthorized_error'
        '403':
          $ref: '#/components/responses/forbidden_error'
        '404':
          $ref: '#/components/responses/not_found_error'
        '409':
          $ref: '#/components/responses/conflict_error'
        '422':
          $ref: '#/components/responses/unprocessable_content_error'
        '500':
          $ref: '#/components/responses/internal_server_error'
  /api/v1/games/{gameId}/expansions/{expansionId}:
    parameters:
      - $ref: '#/components/parameters/path_game_id'
      - $ref: '#/components/parameters/path_expansion_id'
    get:
      summary: Get expansion
      operationId: getExpansion
      security:
        - bearerAuth:
            - stx-engine:expansion-read
      tags:
        - expansions
      responses:
        '200':
          $ref: '#/components/responses/expansion'
        '401':
          $ref: '#/components/responses/unauthorized_error'
        '403':
          $ref: '#/components/responses/forbidden_error'
        '404':
          $ref: '#/components/responses/not_found_error'
  /api/v1/games:
    get:
      summary: List games
      operationId: listGames
      security:
        - bearerAuth:
            - stx-engine:game-read
      tags:
        - games
      parameters:
        - $ref: '#/components/parameters/query_limit'
        - $ref: '#/components/parameters/query_cursor'
        - $ref: '#/components/parameters/query_filter'
        - $ref: '#/components/parameters/query_sort'
      responses:
        '200':
          $ref: '#/components/responses/game_list'
        '400':
          $ref: '#/components/responses/validation_error'
        '401':
          $ref: '#/components/responses/unauthorized_error'
        '403':
          $ref: '#/components/responses/forbidden_error'
        '500':
          $ref: '#/components/responses/internal_server_error'
    post:
      summary: Create game
      description: |
        Adds a game to the catalogue. Requires the `stx-engine:game-create` role; the game catalog service publishes approved candidates through this operation.
      operationId: createGame
      security:
        - bearerAuth:
            - stx-engine:game-create
      tags:
        - games
      parameters:
        - $ref: '#/components/parameters/header_idempotency_key'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/create_game'
      responses:
        '201':
          $ref: '#/components/responses/created_game'
        '400':
          $ref: '#/components/responses/validation_error'
        '401':
          $ref: '#/components/responses/unauthorized_error'
        '403':
          $ref: '#/components/responses/forbidden_error'
        '409':
          $ref: '#/components/responses/conflict_error'
        '422':
          $ref: '#/components/responses/unprocessable_content_error'
        '500':
          $ref: '#/components/responses/internal_server_error'
  /api/v1/playsets:
    get:
      summary: List playsets
      operationId: listPlaysets
      security:
        - bearerAuth:
            - stx-engine:playset-read
      tags:
        - playsets
      parameters:
        - $ref: '#/components/parameters/query_limit'
        - $ref: '#/components/parameters/query_cursor'
        - $ref: '#/components/parameters/query_filter'
        - $ref: '#/components/parameters/query_sort'
      responses:
        '200':
          $ref: '#/components/responses/playset_list'
        '400':
          $ref: '#/components/responses/validation_error'
        '401':
          $ref: '#/components/responses/unauthorized_error'
        '403':
          $ref: '#/components/responses/forbidden_error'
        '500':
          $ref: '#/components/responses/internal_server_error'
    post:
      summary: Create playset
      operationId: createPlayset
      security:
        - bearerAuth:
            - stx-engine:playset-create
      tags:
        - playsets
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/create_playset'
      responses:
        '201':
          $ref: '#/components/responses/playset'
        '400':
          $ref: '#/components/responses/validation_error'
        '401':
          $ref: '#/components/responses/unauthorized_error'
        '403':
          $ref: '#/components/responses/forbidden_error'
        '409':
          $ref: '#/components/responses/conflict_error'
        '500':
          $ref: '#/components/responses/internal_server_error'
  /api/v1/playsets/{playsetId}:
    parameters:
      - $ref: '#/components/parameters/path_playset_id'
    get:
      summary: Get playset
      operationId: getPlayset
      security:
        - bearerAuth:
            - stx-engine:playset-read
      tags:
        - playsets
      responses:
        '200':
          $ref: '#/components/responses/playset'
        '401':
          $ref: '#/components/responses/unauthorized_error'
        '403':
          $ref: '#/components/responses/forbidden_error'
        '404':
          $ref: '#/components/responses/not_found_error'
    patch:
      summary: Update playset
      operationId: updatePlayset
      security:
        - bearerAuth:
            - stx-engine:playset-update
      tags:
        - playsets
      parameters:
        - $ref: '#/components/parameters/header_if_match'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/update_playset'
      responses:
        '200':
          $ref: '#/components/responses/playset'
        '400':
          $ref: '#/components/responses/validation_error'
        '401':
          $ref: '#/components/responses/unauthorized_error'
        '403':
          $ref: '#/components/responses/forbidden_error'
        '404':
          $ref: '#/components/responses/not_found_error'
        '412':
          $ref: '#/components/responses/precondition_failed_error'
    delete:
      summary: Delete playset
      operationId: deletePlayset
      security:
        - bearerAuth:
            - stx-engine:playset-delete
      tags:
        - playsets
      parameters:
        - $ref: '#/components/parameters/header_if_match'
      responses:
        '204':
          description: Deleted successfully
        '401':
          $ref: '#/components/responses/unauthorized_error'
        '403':
          $ref: '#/components/responses/forbidden_error'
        '404':
          $ref: '#/components/responses/not_found_error'
        '412':
          $ref: '#/components/responses/precondition_failed_error'
  /api/v1/ghost-players/count:
    get:
      summary: Count ghost players
      operationId: countGhostPlayers
      security:
        - bearerAuth:
            - stx-engine:ghost-player-read
      tags:
        - ghostPlayers
      parameters:
        - $ref: '#/components/parameters/query_filter'
      responses:
        '200':
          $ref: '#/components/responses/count'
        '400':
          $ref: '#/components/responses/validation_error'
        '401':
          $ref: '#/components/responses/unauthorized_error'
        '403':
          $ref: '#/components/responses/forbidden_error'
        '500':
          $ref: '#/components/responses/internal_server_error'
  /api/v1/ghost-players/suggestions:
    get:
      summary: Get ghost player suggestions
      operationId: getGhostPlayerSuggestions
      security:
        - bearerAuth:
            - stx-engine:ghost-player-read
      tags:
        - ghostPlayers
      parameters:
        - $ref: '#/components/parameters/query_query'
      responses:
        '200':
          $ref: '#/components/responses/ghost_player_ref_list'
        '400':
          $ref: '#/components/responses/validation_error'
        '401':
          $ref: '#/components/responses/unauthorized_error'
        '403':
          $ref: '#/components/responses/forbidden_error'
        '500':
          $ref: '#/components/responses/internal_server_error'
  /api/v1/ghost-players/{ghostPlayerId}:
    parameters:
      - $ref: '#/components/parameters/path_ghost_player_id'
    get:
      summary: Get ghost player
      operationId: getGhostPlayer
      security:
        - bearerAuth:
            - stx-engine:ghost-player-read
      tags:
        - ghostPlayers
      responses:
        '200':
          $ref: '#/components/responses/ghost_player'
        '401':
          $ref: '#/components/responses/unauthorized_error'
        '403':
          $ref: '#/components/responses/forbidden_error'
        '404':
          $ref: '#/components/responses/not_found_error'
    patch:
      summary: Update ghost player
      operationId: updateGhostPlayer
      security:
        - bearerAuth:
            - stx-engine:ghost-player-update
      tags:
        - ghostPlayers
      parameters:
        - $ref: '#/components/parameters/header_if_match'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/update_ghost_player'
      responses:
        '200':
          $ref: '#/components/responses/ghost_player'
        '400':
          $ref: '#/components/responses/validation_error'
        '401':
          $ref: '#/components/responses/unauthorized_error'
        '403':
          $ref: '#/components/responses/forbidden_error'
        '404':
          $ref: '#/components/responses/not_found_error'
        '412':
          $ref: '#/components/responses/precondition_failed_error'
    delete:
      summary: Delete ghost player
      operationId: deleteGhostPlayer
      security:
        - bearerAuth:
            - stx-engine:ghost-player-delete
      tags:
        - ghostPlayers
      parameters:
        - $ref: '#/components/parameters/header_if_match'
      responses:
        '204':
          description: Deleted successfully
        '401':
          $ref: '#/components/responses/unauthorized_error'
        '403':
          $ref: '#/components/responses/forbidden_error'
        '404':
          $ref: '#/components/responses/not_found_error'
        '412':
          $ref: '#/components/responses/precondition_failed_error'
  /api/v1/ghost-players:
    get:
      summary: List ghost players
      operationId: listGhostPlayers
      security:
        - bearerAuth:
            - stx-engine:ghost-player-read
      tags:
        - ghostPlayers
      parameters:
        - $ref: '#/components/parameters/query_limit'
        - $ref: '#/components/parameters/query_cursor'
        - $ref: '#/components/parameters/query_filter'
        - $ref: '#/components/parameters/query_sort'
      responses:
        '200':
          $ref: '#/components/responses/ghost_player_list'
        '400':
