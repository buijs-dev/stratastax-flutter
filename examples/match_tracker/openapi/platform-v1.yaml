        - $ref: '#/components/parameters/query_sort'
      responses:
        '200':
          $ref: '#/components/responses/membership_request_list'
        '401':
          $ref: '#/components/responses/unauthorized_error'
        '403':
          $ref: '#/components/responses/forbidden_error'
        '404':
          $ref: '#/components/responses/not_found_error'
        '500':
          $ref: '#/components/responses/internal_server_error'
    post:
      summary: Submit a membership request (REQUIRES_APPROVAL join policy)
      operationId: createMembershipRequest
      security:
        - bearerAuth:
            - stx-engine:membership-request-create
      tags:
        - membershipRequests
      responses:
        '201':
          $ref: '#/components/responses/membership_request'
        '400':
          $ref: '#/components/responses/validation_error'
        '401':
          $ref: '#/components/responses/unauthorized_error'
        '403':
          $ref: '#/components/responses/forbidden_error'
        '404':
          $ref: '#/components/responses/not_found_error'
        '409':
          $ref: '#/components/responses/conflict_error'
  /api/v1/communities/{communityId}/membership-requests/{requestId}:
    parameters:
      - $ref: '#/components/parameters/path_community_id'
      - $ref: '#/components/parameters/path_request_id'
    get:
      summary: Get membership request
      operationId: getMembershipRequest
      security:
        - bearerAuth:
            - stx-engine:membership-request-read
      tags:
        - membershipRequests
      responses:
        '200':
          $ref: '#/components/responses/membership_request'
        '401':
          $ref: '#/components/responses/unauthorized_error'
        '403':
          $ref: '#/components/responses/forbidden_error'
        '404':
          $ref: '#/components/responses/not_found_error'
    patch:
      summary: Decide on a membership request (approve or reject)
      operationId: decideMembershipRequest
      security:
        - bearerAuth:
            - stx-engine:membership-request-decide
      tags:
        - membershipRequests
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/decide_membership_request'
      responses:
        '200':
          $ref: '#/components/responses/membership_request'
        '400':
          $ref: '#/components/responses/validation_error'
        '401':
          $ref: '#/components/responses/unauthorized_error'
        '403':
          $ref: '#/components/responses/forbidden_error'
        '404':
          $ref: '#/components/responses/not_found_error'
        '409':
          $ref: '#/components/responses/conflict_error'
  /api/v1/users/me:
    get:
      summary: Get the current user
      description: |
        The authenticated user, with their canonical player and the ghost player that represents themselves when they record a match.
      operationId: getCurrentUser
      security:
        - bearerAuth:
            - stx-engine:user-read
      tags:
        - users
      responses:
        '200':
          $ref: '#/components/responses/current_user'
        '401':
          $ref: '#/components/responses/unauthorized_error'
        '403':
          $ref: '#/components/responses/forbidden_error'
  /api/v1/users/suggestions:
    get:
      summary: Get user suggestions
      description: |
        Users whose display name matches the query, e.g. to add one to a group or to grant them trusted editor rights.
      operationId: getUserSuggestions
      security:
        - bearerAuth:
            - stx-engine:user-read
      tags:
        - users
      parameters:
        - $ref: '#/components/parameters/query_query'
      responses:
        '200':
          $ref: '#/components/responses/user_ref_list'
        '400':
          $ref: '#/components/responses/validation_error'
        '401':
          $ref: '#/components/responses/unauthorized_error'
        '403':
          $ref: '#/components/responses/forbidden_error'
        '500':
          $ref: '#/components/responses/internal_server_error'
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
  parameters:
    query_filter:
      name: filter
      in: query
      required: false
      description: |
        RSQL filter expression evaluated against this resource's filterable fields. Combine multiple conditions with `;` (AND) or `,` (OR), e.g. `gameId==3fa85f64-...;playedAt=gt=2026-01-01T00:00:00Z`. The set of filterable fields is documented per endpoint in the API reference (Starlight docs); filtering on a field that isn't in that whitelist returns 400 Bad Request.
      schema:
        type: string
    path_match_id:
      name: matchId
      in: path
      required: true
      description: Public match identifier
      schema:
        type: string
        format: uuid
    header_if_match:
      name: If-Match
      in: header
      required: true
      description: |
        ETag of the resource being modified, for optimistic concurrency control. Obtain this from the ETag response header of a previous GET/PATCH.
      schema:
        type: string
    query_limit:
      name: limit
      in: query
      required: false
      description: Maximum number of items to return
      schema:
        type: integer
        minimum: 1
        maximum: 100
    query_cursor:
      name: cursor
      in: query
      required: false
      description: |
        Opaque cursor from a previous response's nextCursor. Omit to fetch the first page. Clients must treat this value as opaque and only pass back what was previously returned.
      schema:
        type: string
    query_sort:
      name: sort
      in: query
      required: false
      description: |
        Sort order. Format: `field:direction`. Direction is ASC or DESC (default ASC if omitted). 
        Use a comma-separated list for multi-column sorting — priority follows the parameter order.
      schema:
        type: string
        pattern: ^([a-zA-Z0-9_]+(:(ASC|DESC))?)(,([a-zA-Z0-9_]+(:(ASC|DESC))?))*$
      examples:
        singleColumn:
          summary: Sort by a single column
          value: playedAt:DESC
        multiColumn:
          summary: Sort by multiple columns
          value: playedAt:DESC,status:ASC
        implicitDirection:
          summary: Omitted direction defaults to ASC
          value: status,playedAt:DESC
    path_edit_id:
      name: editId
      in: path
      required: true
      description: Public match edit identifier
      schema:
        type: string
        format: uuid
    query_query:
      name: query
      in: query
      required: true
      schema:
        type: string
        minLength: 1
      description: Free-text search term for suggestion matching
    path_game_id:
      name: gameId
      in: path
      required: true
      description: Public identifier
      schema:
        type: string
        format: uuid
    header_idempotency_key:
      name: Idempotency-Key
      in: header
      required: true
      description: |
        Client-generated UUIDv7 that makes the request safe to retry. A repeated request with the same key and the same payload returns the stored response (marked with the `Idempotent-Replayed: true` header) instead of executing again. Keys older than the retention window (30 days) are rejected.
      schema:
        type: string
        example: 0192f100-0000-7000-8000-0000000000a5
    path_expansion_id:
      name: expansionId
      in: path
      required: true
      description: Public expansion identifier
      schema:
        type: string
        format: uuid
    path_playset_id:
      name: playsetId
      in: path
      required: true
      description: Public playset identifier
      schema:
        type: string
        format: uuid
    path_ghost_player_id:
      name: ghostPlayerId
      in: path
      required: true
      description: Public ghost player identifier
      schema:
        type: string
        format: uuid
    path_canonical_player_id:
      name: canonicalPlayerId
      in: path
      required: true
      description: Public canonical player identifier
      schema:
        type: string
        format: uuid
    path_trusted_editor_id:
      name: trustedEditorId
      in: path
      required: true
      description: Public trusted editor identifier
      schema:
        type: string
        format: uuid
    path_claim_request_id:
      name: claimRequestId
      in: path
      required: true
      description: Public claim request identifier
      schema:
        type: string
        format: uuid
    path_claim_edge_id:
      name: claimEdgeId
      in: path
      required: true
      description: Public claim edge identifier
      schema:
        type: string
        format: uuid
    path_privacy_setting_id:
      name: privacySettingId
      in: path
      required: true
      description: Public privacy setting identifier
      schema:
        type: string
        format: uuid
    path_group_id:
      name: groupId
      in: path
      required: true
      description: Public group identifier
      schema:
        type: string
        format: uuid
    path_user_id:
      name: userId
      in: path
      required: true
      description: Public user identifier
      schema:
        type: string
        format: uuid
    path_community_id:
      name: communityId
      in: path
      required: true
      description: Public community identifier
      schema:
        type: string
        format: uuid
    path_request_id:
      name: requestId
      in: path
      required: true
      description: Public request identifier
      schema:
        type: string
        format: uuid
  schemas:
    count:
      type: object
      required:
        - count
      properties:
        count:
          type: integer
          format: int64
          minimum: 0
          description: Total number of records matching the given filter criteria
    error_type:
      type: string
      description: Canonical error type identifier (URI)
      enum:
        - https://errors.stratastax.io/authentication
        - https://errors.stratastax.io/authorization
        - https://errors.stratastax.io/validation
        - https://errors.stratastax.io/not-found
        - https://errors.stratastax.io/conflict
        - https://errors.stratastax.io/precondition-failed
        - https://errors.stratastax.io/internal
    problem_detail:
      type: object
      required:
        - type
        - title
        - status
        - detail
      properties:
        type:
          $ref: '#/components/schemas/error_type'
        title:
          type: string
          description: Short, human-readable summary
        status:
          type: integer
          format: int32
          description: HTTP status code
        detail:
          type: string
          description: Human-readable explanation
        instance:
          type: string
          format: uri
          description: URI of the request that caused the error
    validation_error:
      type: object
      required:
        - field
        - code
        - message
      properties:
        field:
          type: string
          description: Field or property that failed validation
        code:
          type: string
          description: |
            Machine-readable validation error code, e.g. REQUIRED, VALUE_TOO_LONG, INVALID_FORMAT, OUT_OF_RANGE. Canonical list is maintained per resource in the documentation.
        message:
          type: string
          description: Human readable validation message
        rejectedValue:
          description: The actual value that failed validation. Omitted if the value is sensitive.
    validation_problem_detail:
      allOf:
        - $ref: '#/components/schemas/problem_detail'
        - type: object
          properties:
            errors:
              type: array
              items:
                $ref: '#/components/schemas/validation_error'
    game_ref:
      type: object
      required:
        - id
        - displayName
      properties:
        id:
          type: string
          format: uuid
        displayName:
          type: string
    playset_ref:
      type: object
      required:
        - id
        - displayName
      properties:
        id:
          type: string
          format: uuid
        displayName:
          type: string
    community_ref:
      type: object
      required:
        - id
        - displayName
      properties:
        id:
          type: string
          format: uuid
        displayName:
          type: string
    user_ref:
      type: object
      required:
        - id
        - displayName
      properties:
        id:
          type: string
          format: uuid
        displayName:
          type: string
    match_status:
      type: string
      description: |
        DRAFT matches are freely mutable directly via PATCH. Once a match is finalized it becomes immutable except through the match-edit proposal and approval workflow.
      enum:
        - DRAFT
        - FINALIZED
    date_time:
      description: date-time (ISO 8601)
      type: string
      format: date-time
    expansion_ref:
      type: object
      required:
        - id
        - displayName
      properties:
        id:
          type: string
          format: uuid
        displayName:
          type: string
    ghost_player_ref:
      type: object
      required:
        - id
        - displayName
      properties:
        id:
          type: string
          format: uuid
        displayName:
          type: string
    outcome:
      type: string
      enum:
        - WIN
        - LOSS
    loadout:
      type: object
      required:
        - id
        - attributes
        - createdAt
      properties:
        id:
          type: string
          format: uuid
        attributes:
          type: object
          additionalProperties: true
        createdAt:
          $ref: '#/components/schemas/date_time'
    match_participant:
      type: object
      required:
        - id
        - ghostPlayer
        - createdAt
      properties:
        id:
          type: string
          format: uuid
        ghostPlayer:
          $ref: '#/components/schemas/ghost_player_ref'
        score:
          type: number
        rank:
          type: integer
          format: int32
        outcome:
          $ref: '#/components/schemas/outcome'
        disputeReason:
          type: string
        loadout:
          $ref: '#/components/schemas/loadout'
        createdAt:
          $ref: '#/components/schemas/date_time'
    match:
      type: object
      required:
        - id
        - game
        - recorder
        - status
        - playedAt
        - editRequestsEnabled
        - createdAt
        - participants
      properties:
        id:
          type: string
          format: uuid
        game:
          $ref: '#/components/schemas/game_ref'
        playset:
          $ref: '#/components/schemas/playset_ref'
        community:
          $ref: '#/components/schemas/community_ref'
        recorder:
          $ref: '#/components/schemas/user_ref'
        status:
          $ref: '#/components/schemas/match_status'
        playedAt:
          $ref: '#/components/schemas/date_time'
        editRequestsEnabled:
          type: boolean
        lockedAt:
          $ref: '#/components/schemas/date_time'
          description: Set automatically when the match transitions to FINALIZED.
        lastEditedAt:
          $ref: '#/components/schemas/date_time'
        lastEditedBy:
          $ref: '#/components/schemas/user_ref'
        createdAt:
          $ref: '#/components/schemas/date_time'
        expansions:
          type: array
          items:
            $ref: '#/components/schemas/expansion_ref'
        participants:
          type: array
          minItems: 1
          items:
            $ref: '#/components/schemas/match_participant'
    match_participant_input:
      type: object
      required:
        - ghostPlayerId
      properties:
        ghostPlayerId:
          type: string
          format: uuid
        score:
          type: number
        rank:
          type: integer
          format: int32
        outcome:
          $ref: '#/components/schemas/outcome'
        loadoutAttributes:
          type: object
          additionalProperties: true
    update_match:
      type: object
      description: |
        Update match fields. While the match has status DRAFT, all fields below may be updated directly. Once the match is FINALIZED, only playedAt and editRequestsEnabled remain directly editable — attempting to change playsetId, communityId or participants on a finalized match returns 409 Conflict; use POST /matches/{matchId}/edits instead.
      properties:
        playsetId:
          type:
            - string
            - 'null'
          format: uuid
        communityId:
          type:
            - string
            - 'null'
          format: uuid
        playedAt:
          anyOf:
            - $ref: '#/components/schemas/date_time'
            - type: 'null'
        editRequestsEnabled:
          type:
            - boolean
            - 'null'
        expansions:
          type:
            - array
            - 'null'
          items:
            type: string
            format: uuid
          description: |
            Replaces the complete expansion collection.

            If omitted, the existing expansions remain unchanged.
            If provided, the complete expansion collection is replaced
            by the supplied collection.
        participants:
          type:
            - array
            - 'null'
          minItems: 1
          description: |
            Replaces the complete participant collection.

            If omitted, the existing participants remain unchanged.
            If provided, the complete participant collection is replaced
            by the supplied collection.

            Each participant must be fully specified. Partial participant
            updates are not supported while the match is in DRAFT status.
          items:
            $ref: '#/components/schemas/match_participant_input'
    paged_metadata:
      type: object
      required:
        - limit
      properties:
        limit:
          type: integer
          format: int32
          description: Maximum number of items returned in this page
        prevCursor:
          type:
            - string
            - 'null'
          description: |
            Opaque cursor to pass as the `cursor` query parameter to fetch the previous page. Null when there is no previous results. Clients must not parse or construct this value.
        nextCursor:
          type:
            - string
            - 'null'
          description: |
            Opaque cursor to pass as the `cursor` query parameter to fetch the next page. Null when there are no more results. Clients must not parse or construct this value.
    approval_status:
      type: string
      enum:
        - PENDING
        - APPROVED
        - REJECTED
    match_edit_participant_change:
      type: object
      description: |
        A proposed change to one participant's result. Only the fields flagged as set are written when the edit is applied; a field that is set but absent is cleared.
      required:
        - matchParticipantId
        - scoreSet
        - rankSet
        - outcomeSet
      properties:
        matchParticipantId:
          type: string
          format: uuid
        score:
          type: number
        rank:
          type: integer
          format: int32
        outcome:
          $ref: '#/components/schemas/outcome'
        scoreSet:
          type: boolean
        rankSet:
          type: boolean
        outcomeSet:
          type: boolean
    match_edit_loadout_change:
      type: object
      required:
        - matchParticipantId
        - attributes
      properties:
        matchParticipantId:
          type: string
          format: uuid
        attributes:
          type: object
          additionalProperties: true
    match_edit_playset_change:
      type: object
      required:
        - newPlaysetId
      properties:
        newPlaysetId:
          type: string
          format: uuid
    match_edit:
      type: object
      required:
        - id
        - matchId
        - proposedBy
        - status
        - createdAt
      properties:
        id:
          type: string
          format: uuid
        matchId:
          type: string
          format: uuid
        proposedBy:
          $ref: '#/components/schemas/user_ref'
        approvedBy:
          $ref: '#/components/schemas/user_ref'
        status:
          $ref: '#/components/schemas/approval_status'
        participantChanges:
          type: array
          items:
            $ref: '#/components/schemas/match_edit_participant_change'
        loadoutChanges:
          type: array
          items:
            $ref: '#/components/schemas/match_edit_loadout_change'
        playsetChange:
          $ref: '#/components/schemas/match_edit_playset_change'
        createdAt:
          $ref: '#/components/schemas/date_time'
    match_edit_list:
      type: object
      allOf:
        - $ref: '#/components/schemas/paged_metadata'
        - type: object
          required:
            - items
          properties:
            items:
              type: array
              description: Match edits in this page
              items:
                $ref: '#/components/schemas/match_edit'
    match_edit_participant_change_input:
      type: object
      description: |
        A proposed change to one participant's result. A property that is absent is left unchanged; a property that is present replaces the current value, and null clears it.
      required:
        - matchParticipantId
      properties:
        matchParticipantId:
          type: string
          format: uuid
        score:
          type:
            - number
            - 'null'
        rank:
          type:
            - integer
            - 'null'
          format: int32
        outcome:
          anyOf:
            - $ref: '#/components/schemas/outcome'
            - type: 'null'
    create_match_edit:
      type: object
      properties:
        participantChanges:
          type: array
          items:
            $ref: '#/components/schemas/match_edit_participant_change_input'
        loadoutChanges:
          type: array
          items:
            $ref: '#/components/schemas/match_edit_loadout_change'
        playsetChange:
          $ref: '#/components/schemas/match_edit_playset_change'
    decide_match_edit:
      type: object
      required:
        - status
      properties:
        status:
          type: string
          enum:
            - APPROVED
            - REJECTED
    match_list:
      type: object
      allOf:
        - $ref: '#/components/schemas/paged_metadata'
        - type: object
          required:
            - items
          properties:
            items:
              type: array
              description: Matches in this page
              items:
                $ref: '#/components/schemas/match'
    create_match:
      type: object
      required:
        - gameId
        - playedAt
        - participants
      properties:
        gameId:
          type: string
          format: uuid
        playedAt:
          $ref: '#/components/schemas/date_time'
        participants:
          type: array
          minItems: 1
          items:
            $ref: '#/components/schemas/match_participant_input'
        expansions:
          type: array
          items:
            type: string
            format: uuid
        playsetId:
          type: string
          format: uuid
        communityId:
          type: string
          format: uuid
        editRequestsEnabled:
          type: boolean
          default: true
    create_match_batch:
      type: array
      description: Create multiple matches in a single request.
      minItems: 1
      maxItems: 50
      items:
        $ref: '#/components/schemas/create_match'
    match_batch_result_item:
      type: object
      required:
        - status
      properties:
        status:
          type: string
          enum:
            - CREATED
            - FAILED
        match:
          $ref: '#/components/schemas/match'
        error:
          $ref: '#/components/schemas/problem_detail'
    match_batch_result:
      type: object
      required:
        - results
      properties:
        results:
          type: array
          items:
            $ref: '#/components/schemas/match_batch_result_item'
    score_type:
      type: string
      enum:
        - SCORE
        - TIME
        - TURNS
        - WIN_LOSS
    win_condition:
      type: string
      enum:
        - HIGHER_WINS
        - LOWER_WINS
    game:
      type: object
      required:
        - id
        - displayName
        - description
        - minPlayers
        - maxPlayers
        - scoreType
        - tags
      properties:
        id:
          type: string
          format: uuid
        displayName:
          type: string
        description:
          type: string
        minPlayers:
          type: integer
          format: int32
        maxPlayers:
          type: integer
          format: int32
        imageUrl:
          type: string
          format: uri
        tags:
          type: array
          items:
            type: string
        scoreType:
          $ref: '#/components/schemas/score_type'
        winCondition:
          $ref: '#/components/schemas/win_condition'
        expansions:
          type: array
          items:
            $ref: '#/components/schemas/expansion_ref'
        sourceRef:
          type: string
          description: Where it came from, e.g. `bgg:199792`; absent for one entered by hand.
        createdAt:
          $ref: '#/components/schemas/date_time'
        updatedAt:
          $ref: '#/components/schemas/date_time'
    expansion:
      type: object
      required:
        - id
        - game
        - displayName
        - createdAt
      properties:
        id:
          type: string
          format: uuid
        game:
          $ref: '#/components/schemas/game_ref'
        displayName:
          type: string
        description:
          type: string
        imageUrl:
          type: string
          format: uri
        sourceRef:
          type: string
          description: Where it came from, e.g. `bgg:199792`; absent for one entered by hand.
        createdAt:
          $ref: '#/components/schemas/date_time'
        updatedAt:
          $ref: '#/components/schemas/date_time'
    expansion_list:
      type: object
      allOf:
        - $ref: '#/components/schemas/paged_metadata'
        - type: object
          required:
            - items
          properties:
            items:
              type: array
              description: Expansions in this page
              items:
                $ref: '#/components/schemas/expansion'
    create_expansion:
      type: object
      required:
        - displayName
      properties:
        displayName:
          type: string
        description:
          type: string
        imageUrl:
          type: string
          format: uri
        sourceRef:
          type: string
          maxLength: 64
          description: |
